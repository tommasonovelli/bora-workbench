name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type publish-bora-workbench to authorize this PyPI run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test Python 3.12.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.13

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check source
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Run tests
        run: uv run --frozen pytest

      - name: Validate packaged content
        run: uv run --frozen bora validate

  build:
    name: Build tested distributions
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.13

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(uv run --frozen python -c 'from importlib.metadata import version; print(version("bora-workbench"))')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify wheel in isolation
        run: uv run --frozen python scripts/verify_wheel.py

      - name: Verify complete uninstall in isolation
        run: uv run --frozen python scripts/verify_uninstall.py

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Build release bundle and SHA-256 manifest
        shell: bash
        run: |
          mkdir release
          cp dist/*.whl dist/*.tar.gz install.sh install.ps1 release/
          cd release
          sha256sum *.whl *.tar.gz install.sh install.ps1 > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bora-workbench-release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == 'publish-bora-workbench' }}
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/bora-workbench
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
