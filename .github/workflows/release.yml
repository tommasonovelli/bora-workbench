name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python 3.12.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.13

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check source
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Run tests
        run: uv run --frozen pytest

      - name: Validate packaged content
        run: uv run --frozen qwen-launcher validate

  build:
    name: Build tested distributions
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.13

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(uv run --frozen python -c 'from importlib.metadata import version; print(version("qwen-launcher"))')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify wheel in isolation
        run: uv run --frozen python scripts/verify_wheel.py

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/qwen-launcher
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
