name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.13

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Test
        run: uv run --frozen pytest

      - name: Validate packaged content
        run: uv run --frozen bora validate

      - name: Build distributions
        run: uv build

      - name: Verify wheel in isolation
        run: uv run --frozen python scripts/verify_wheel.py

      - name: Verify complete uninstall in isolation
        run: uv run --frozen python scripts/verify_uninstall.py
